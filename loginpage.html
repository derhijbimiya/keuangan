<!doctype html>
<html>
  <head>
    <base target="_top">
    <?!= include('styleslogin'); ?>
    <!-- Meta viewport di sini sebagai cadangan, yang utama ada di Code.gs -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style id="themeStyle"></style>
  </head>
  <body class="auth">
    <div id="toastRoot" class="toast-wrap" aria-live="polite" aria-atomic="true" style="display:none;"></div>

    <section class="phone">
      <div class="topbar">
        <div class="logo">LOGO</div>
        <div class="theme-mini">
          <select id="themeSelectLogin" onchange="applySelectedThemeOnLogin()"></select>
        </div>
      </div>

      <div class="header">
        <div class="avatar">👤</div>
        <h1 class="headline">
          <span class="title-text">Financial Applications</span>
          <span class="badge-v2">V2</span>
        </h1>
        <p id="subline" class="subline">Catat pemasukan, pengeluaran, dan tabungan secara rapi.</p>

        <div id="signupDots" class="wizard-steps" style="display:none;">
          <span class="dot" data-i="1"></span>
          <span class="dot" data-i="2"></span>
          <span class="dot" data-i="3"></span>
          <span class="dot" data-i="4"></span>
        </div>
      </div>

      <div class="curve"></div>

      <div class="form">
        <!-- LOGIN PANEL -->
        <div id="panel-login" class="panel active">
          <!-- Google Sign-In Button -->
          <div id="gSignInWrapper" style="margin-bottom:16px; text-align:center">
            <div id="g_id_onload"
              data-client_id="YOUR_GOOGLE_CLIENT_ID"
              data-context="signin"
              data-ux_mode="popup"
              data-callback="onGoogleSignIn"
              data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
              data-type="standard"
              data-shape="rectangular"
              data-theme="outline"
              data-text="sign_in_with"
              data-size="large"
              data-logo_alignment="left">
            </div>
          </div>
          <div class="field"><input id="login-username" placeholder="USER NAME/ID"></div>
          <div class="field"><input id="login-password" type="password" placeholder="PASSWORD"></div>

          <button id="btnLogin" class="btn" onclick="login()">LOGIN</button>

          <div class="row">
            <span class="remember"><input id="rememberMe" type="checkbox"> Remember me</span>
            <a class="link" onclick="showPanel('forgot')">Forgot password?</a>
          </div>

          <div class="row" style="justify-content:center; margin-top:20px;">
            <span style="color:rgba(255,255,255,0.6)">Not registered?</span>
            <a class="link" onclick="startSignupWizard()" style="margin-left:8px">Create account</a>
          </div>
        </div>

        <!-- SIGNUP PANEL -->
        <div id="panel-signup" class="panel">
          <div id="su-step-1" class="su-step">
            <div class="field"><input id="su-username" placeholder="USERNAME"></div>
            <div class="field"><input id="su-nama" placeholder="NAMA LENGKAP"></div>
            <div class="field"><input id="su-email" placeholder="EMAIL GMAIL"></div>
            <button id="btnSu1" class="btn" onclick="signupNextFromStep1()">NEXT (Send OTP)</button>
            <button class="btn secondary" onclick="showPanel('login')">BACK</button>
          </div>
          <div id="su-step-2" class="su-step" style="display:none">
            <div class="field"><input id="su-otp" placeholder="OTP CODE"></div>
            <button class="btn" onclick="signupNext()">NEXT</button>
            <button class="btn secondary" onclick="signupPrev()">BACK</button>
          </div>
          <div id="su-step-3" class="su-step" style="display:none">
            <div class="field"><input id="su-password" type="password" placeholder="PASSWORD"></div>
            <div class="field"><input id="su-password2" type="password" placeholder="CONFIRM PASSWORD"></div>
            <button class="btn" onclick="signupNext()">NEXT</button>
            <button class="btn secondary" onclick="signupPrev()">BACK</button>
          </div>
          <div id="su-step-4" class="su-step" style="display:none">
             <div style="font-size:12px; margin-bottom:10px">Pilih Foto Profil (Opsional)</div>
             <div id="presetGrid" class="preset-grid"></div>
             <div class="field"><select id="su-theme"></select></div>
             <input id="su-fotoUrl" type="hidden">
             <button id="btnCreate" class="btn" onclick="signupSubmit()">CREATE ACCOUNT</button>
             <button class="btn secondary" onclick="signupPrev()">BACK</button>
          </div>
        </div>

        <!-- FORGOT PANEL -->
        <div id="panel-forgot" class="panel">
          <div class="field"><input id="fp-email" placeholder="EMAIL"></div>
          <button id="btnFpOtp" class="btn" onclick="sendOtp('reset')">SEND OTP</button>
          <div class="field"><input id="fp-otp" placeholder="OTP CODE"></div>
          <div class="field"><input id="fp-newpass" type="password" placeholder="NEW PASSWORD"></div>
          <button id="btnReset" class="btn" onclick="resetPassword()">RESET PASSWORD</button>
          <button class="btn secondary" onclick="showPanel('login')" style="margin-top:10px">BACK</button>
        </div>
      </div>
    </section>

    <script>
          // Google Sign-In SDK
          const script = document.createElement('script');
          script.src = "https://accounts.google.com/gsi/client";
          script.async = true;
          script.defer = true;
          document.head.appendChild(script);

          // Google Sign-In callback
          function onGoogleSignIn(response) {
            // Decode JWT to get user info
            const id_token = response.credential;
            const payload = JSON.parse(atob(id_token.split('.')[1]));
            const email = payload.email;
            if(email){
              // Kirim email ke backend Apps Script
              google.script.run.withSuccessHandler(function(res){
                if(res.ok){
                  showToast('ok', 'Login Google', 'Login berhasil, mengalihkan...');
                  google.script.run.withSuccessHandler(urlRes => {
                    window.top.location.href = urlRes.url;
                  }).apiGetAppUrl();
                } else {
                  showToast('err', 'Login Google', res.message || 'Gagal login Google');
                }
              }).apiLoginGoogle(email);
            } else {
              showToast('err', 'Login Google', 'Gagal mendapatkan email Google');
            }
          }
      // SCRIPT LOGIN LOGIC (Tetap sama dengan milik Anda)
      let toastTimer = null;
      function showToast(type, title, message){
        const root = document.getElementById('toastRoot');
        root.style.display = 'flex';
        root.innerHTML = `<div class="toast ${type}"><div class="bar"></div><div><p class="t-title">${title}</p><p class="t-msg">${message}</p></div><button class="close" onclick="hideToast()">×</button></div>`;
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 4000);
      }
      function hideToast(){ document.getElementById('toastRoot').style.display = 'none'; }

      function setBtnLoading(id, loading, success){
        const b = document.getElementById(id);
        if(loading){
          b.disabled = true; b.innerHTML = '<span class="spinner"></span> LOADING...';
        } else {
          b.disabled = false; b.innerHTML = success ? 'SUCCESS ✓' : b.id.replace('btn','').toUpperCase();
        }
      }

      function showPanel(p){
        ['login','signup','forgot'].forEach(x => document.getElementById('panel-'+x).classList.toggle('active', x===p));
        document.getElementById('signupDots').style.display = p === 'signup' ? 'flex' : 'none';
      }

      function login(){
        const u = document.getElementById('login-username').value;
        const p = document.getElementById('login-password').value;
        const r = document.getElementById('rememberMe').checked;
        if(!u || !p) return showToast('err', 'Gagal', 'Username & Password wajib diisi');
        
        setBtnLoading('btnLogin', true);
        google.script.run.withSuccessHandler(res => {
          setBtnLoading('btnLogin', false, res.ok);
          if(res.ok){
            if(r) localStorage.setItem('sessionToken', res.sessionToken);
            else sessionStorage.setItem('sessionToken', res.sessionToken);
            showToast('ok', 'Berhasil', 'Mengalihkan...');
            google.script.run.withSuccessHandler(urlRes => {
               window.top.location.href = urlRes.url;
            }).apiGetAppUrl();
          } else showToast('err', 'Gagal', res.message);
        }).apiLogin(u, p, r);
      }

      // Signup Wizard logic
      let signupStep = 1;
      function setSignupStep(s){
        signupStep = s;
        [1,2,3,4].forEach(i => document.getElementById('su-step-'+i).style.display = i===s ? 'block' : 'none');
        document.querySelectorAll('.wizard-steps .dot').forEach((d,i) => d.classList.toggle('active', (i+1)===s));
      }
      function signupPrev(){ if(signupStep > 1) setSignupStep(signupStep-1); }
      function signupNext(){ 
        if(signupStep === 2 && !document.getElementById('su-otp').value) return;
        if(signupStep === 3){
          if(document.getElementById('su-password').value !== document.getElementById('su-password2').value) return showToast('err','Error','Password tidak cocok');
        }
        setSignupStep(signupStep+1); 
      }
      function startSignupWizard(){ showPanel('signup'); setSignupStep(1); loadAvatarPresets(); }
      
      function signupNextFromStep1(){
        const e = document.getElementById('su-email').value;
        if(!e) return;
        setBtnLoading('btnSu1', true);
        google.script.run.withSuccessHandler(res => {
          setBtnLoading('btnSu1', false, res.ok);
          if(res.ok){ showToast('ok','OTP Terkirim','Cek email Anda'); setSignupStep(2); }
          else showToast('err','Gagal',res.message);
        }).apiSendOtp('signup', e);
      }

      function signupSubmit(){
        const p = {
          username: document.getElementById('su-username').value,
          nama: document.getElementById('su-nama').value,
          email: document.getElementById('su-email').value,
          otp: document.getElementById('su-otp').value,
          password: document.getElementById('su-password').value,
          theme: document.getElementById('su-theme').value,
          fotoUrl: document.getElementById('su-fotoUrl').value
        };
        setBtnLoading('btnCreate', true);
        google.script.run.withSuccessHandler(res => {
          setBtnLoading('btnCreate', false, res.ok);
          if(res.ok){ showToast('ok','Berhasil','Akun dibuat, silakan login'); showPanel('login'); }
          else showToast('err','Gagal',res.message);
        }).apiSignup(p);
      }

      function loadAvatarPresets(){
        google.script.run.withSuccessHandler(res => {
          const g = document.getElementById('presetGrid'); g.innerHTML = '';
          res.presets.forEach(p => {
            const d = document.createElement('div'); d.className = 'preset-item';
            d.innerHTML = `<img src="${p.url}"><div class="nm">${p.name}</div>`;
            d.onclick = () => {
              document.querySelectorAll('.preset-item').forEach(x => x.classList.remove('active'));
              d.classList.add('active'); document.getElementById('su-fotoUrl').value = p.url;
            };
            g.appendChild(d);
          });
        }).apiAvatarPresetList();
      }

      function loadThemes(){
        google.script.run.withSuccessHandler(res => {
          const s = document.getElementById('themeSelectLogin');
          const su = document.getElementById('su-theme');
          res.themes.forEach(t => {
            const o = new Option(t.name, t.key); s.add(o);
            su.add(new Option(t.name, t.key));
          });
        }).apiThemeList();
      }

      window.onload = () => { loadThemes(); };
      // End Google Sign-In
    </script>
  </body>
</html>
