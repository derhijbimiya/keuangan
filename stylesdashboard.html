  body.dashboard{

    min-height: 100vh;
    /* Background akan di-override oleh theme */
    background: var(--bg);
    padding: 12px;
  }

  body.dashboard::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(var(--dotColor) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.14;
    mix-blend-mode: overlay;
  }

    z-index: 2;
    isolation: isolate;

    backdrop-filter: blur(14px);
    box-shadow: var(--shadow2);
    position: sticky;
    top: 10px;
    z-index: 10;
  }
