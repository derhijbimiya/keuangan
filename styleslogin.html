<style>
  :root{
    --bg: #0a0c18;
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.70);
    --primary: #ff4fd8;
    --primary2: #ff2e88;
    --card: rgba(18, 22, 44, 0.58);
    --border: rgba(255,255,255,0.12);
    --inputBg: rgba(255,255,255,0.08);
    --radius: 22px;
    --shadow: 0 28px 85px rgba(0,0,0,0.55);
    --inputBorder: rgba(255,255,255,0.14);
    --inputText: rgba(255,255,255,0.92);
    --inputPlaceholder: rgba(255,255,255,0.46);
    --btnText: rgba(10, 10, 18, 0.92);
    --toastBg: rgba(10,12,22,0.70);
    --toastBorder: rgba(255,255,255,0.14);
    --toastText: rgba(255,255,255,0.92);
    --toastMuted: rgba(255,255,255,0.72);
    --danger: #ff3a58;
    --ok: #22c55e;
    --warn: #f59e0b;
    --dotColor: rgba(255,255,255,0.06);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; margin:0; padding:0; }

  body.auth{
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg);
    display:grid;
    place-items:center;
    min-height: 100vh;
    overflow-x:hidden;
    position: relative;
  }

  body.auth::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(var(--dotColor) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: 0.16;
    mix-blend-mode: overlay;
  }

  .phone{
    width: min(420px, 95%);
    border-radius: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow:hidden;
    backdrop-filter: blur(14px);
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  .topbar{
    padding: 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }

  .logo{ font-weight: 900; font-size: 12px; letter-spacing: 0.10em; color: rgba(255,255,255,0.88); }

  .theme-mini{
    display:flex;
    align-items:center;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.20);
  }
  .theme-mini select{
    border:0; outline:0; background: transparent;
    color: rgba(255,255,255,0.90); font-weight: 800; font-size: 11px; cursor:pointer;
  }

  .header{ padding: 20px 16px 10px 16px; text-align:center; }
  .avatar{
    width: 58px; height: 58px; border-radius: 999px; margin: 0 auto 10px auto;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    display:grid; place-items:center; font-size: 26px;
  }

  .headline{ margin: 0; font-size: 24px; font-weight: 900; line-height: 1.2; }
  .headline .title-text{
    background: linear-gradient(90deg, var(--primary), var(--primary2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .badge-v2{
    font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: rgba(0,0,0,0.22); border: 1px solid rgba(255,255,255,0.14);
    vertical-align: middle; margin-left: 5px;
  }

  .subline{ margin: 8px 0; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .wizard-steps{ display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .wizard-steps .dot{ width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.16); transition: all .2s; }
  .wizard-steps .dot.active{ width: 20px; border-radius: 10px; background: linear-gradient(90deg, var(--primary), var(--primary2)); }

  .curve{ height: 40px; background: radial-gradient(200px 100px at 50% 0%, rgba(255,255,255,0.05), transparent); }

  .form{ padding: 0 20px 24px 20px; }
  .panel{ display:none; }
  .panel.active{ display:block; }

  .field{
    height: 48px; border-radius: 12px; background: var(--inputBg);
    border: 1px solid var(--inputBorder); padding: 0 14px;
    display:flex; align-items:center; margin-top: 12px;
  }
  .field input, .field select{
    width:100%; border:0; outline:0; background: transparent;
    color: var(--inputText); font-size: 16px;
  }

  .btn{
    width:100%; margin-top: 16px; height: 48px; border-radius: 12px;
    border: none; cursor:pointer; font-weight: 900; letter-spacing: 0.05em;
    background: linear-gradient(90deg, var(--primary), var(--primary2));
    color: var(--btnText); transition: transform 0.1s;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.secondary{ background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--border); }

  .row{ display:flex; justify-content: space-between; align-items:center; margin-top: 12px; font-size: 12px; }
  .link{ color: var(--primary); font-weight: 800; cursor: pointer; text-decoration: none; }

  .preset-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .preset-item{ padding: 8px; border-radius: 10px; background: rgba(255,255,255,0.05); text-align: center; cursor: pointer; border: 1px solid transparent; }
  .preset-item.active{ border-color: var(--primary); background: rgba(255,255,255,0.1); }
  .preset-item img{ width: 40px; height: 40px; border-radius: 50%; }
  .preset-item .nm{ font-size: 9px; margin-top: 4px; color: var(--muted); }

  .spinner{ width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #000; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin-right: 8px; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* MEDIA QUERY UNTUK HP - AGAR PENUH DAN BESAR */
  @media (max-width: 600px) {
    body.auth { padding: 0; display: block; }
    .phone {
      width: 100%;
      max-width: 100%;
      margin: 0;
      border-radius: 0;
      min-height: 100vh;
      border: none;
    }
    .header { padding-top: 30px; }
    .headline { font-size: 26px; }
    .field { height: 54px; }
    .field input { font-size: 18px; }
    .btn { height: 54px; font-size: 16px; }
  }

  /* Toast */
  .toast-wrap{ position: fixed; top: 20px; left: 20px; right: 20px; z-index: 9999; display: flex; justify-content: center; pointer-events: none; }
  .toast{ pointer-events: auto; background: var(--toastBg); border: 1px solid var(--toastBorder); padding: 12px; border-radius: 12px; display: flex; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; backdrop-filter: blur(10px); }
  .toast .bar{ width: 4px; border-radius: 2px; background: var(--warn); }
  .toast.ok .bar{ background: var(--ok); }
  .toast.err .bar{ background: var(--danger); }
  .toast .t-title{ font-weight: 900; font-size: 13px; margin: 0; }
  .toast .t-msg{ font-size: 12px; color: var(--muted); margin: 4px 0 0 0; }
  .toast .close{ margin-left: auto; background: none; border: none; color: white; cursor: pointer; font-size: 18px; }
</style>
