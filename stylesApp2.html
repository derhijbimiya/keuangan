<!-- stylesApp2.html -->
<style>
.shell {
  min-height: 100vh;
  background: var(--bg-main);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-card);
  box-shadow: 0 2px 8px var(--card-shadow, rgba(0,0,0,0.06));
  padding: 0 0 2px 0;
}
.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark img {
  width: 52px;
  height: 52px;
  object-fit: contain;
}
.brand-title {
  font-size: 1.18em;
  font-weight: 900;
  color: var(--text-main);
}
.brand-sub {
  font-size: 0.98em;
  color: var(--text-soft);
}
.userchip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border-radius: 16px;
  padding: 4px 12px;
  font-size: 0.98em;
  color: var(--text-main);
  border: 1px solid var(--border-color);
}
.clockpill {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-size: 0.98em;
  color: var(--text-soft);
  margin-left: 12px;
}
.top-actions {
  margin-left: 12px;
}
.iconbtn.menu {
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  transition: background 0.15s;
}
.iconbtn.menu:hover {
  background: #f0f0f0;
}
.hamb {
  display: inline-block;
  width: 24px;
  height: 18px;
  position: relative;
}
.hamb i {
  display: block;
  height: 3px;
  background: #444;
  margin: 4px 0;
  border-radius: 2px;
}
.menu-modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.18);
  align-items: center;
  justify-content: center;
}
.menu-modal[aria-hidden="false"], .menu-modal:has(.dialog) {
  display: flex;
}
.menu-modal .dialog {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  padding: 0;
  min-width: 320px;
  max-width: 96vw;
}
.menu-card {
  padding: 24px 18px 18px 18px;
}
.menu-card .head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.menu-card .title {
  font-size: 1.18em;
  font-weight: 900;
}
.iconbtn.small.closex {
  background: none;
  border: none;
  font-size: 1.3em;
  cursor: pointer;
  color: #888;
  border-radius: 8px;
  padding: 2px 8px;
}
.iconbtn.small.closex:hover {
  background: #f0f0f0;
  color: #222;
}
.mini-label {
  font-size: 0.92em;
  color: #888;
  margin-bottom: 4px;
}
.theme-select-wrapper {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}
.styled-select {
  padding: 6px 18px 6px 8px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 1em;
  background: #fafafa;
  color: #444;
  appearance: none;
}
.select-arrow {
  font-size: 0.9em;
  color: #888;
}

.btn.secondary.full {
  width: 100%;
  background: var(--accent-soft);
  color: var(--accent);
  border: none;
  border-radius: 10px;
  padding: 10px 0;
  font-weight: 700;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.15s;
}
.btn.secondary.full:hover {
  background: var(--accent);
  color: var(--bg-main);
}

.menu-foot {
  margin-top: 18px;
  text-align: center;
  color: #888;
  font-size: 0.95em;
}

.app2-container {
  padding: 24px;
  background: var(--bg-main);
  min-height: 100vh;
}
.app2-title {
  font-size: 1.5em;
  font-weight: bold;
  margin-bottom: 16px;
  color: var(--text-main);
}

@media (max-width: 560px) {
  .topbar-row { height: 48px; padding: 0 6px; }
  .brand-mark img { width: 36px; height: 36px; }
  .app2-container { padding: 12px; }
  .menu-modal .dialog { min-width: 90vw; }
}
</style>
