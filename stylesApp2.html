<!-- stylesApp2.html -->
<style>
.shell {
  position: relative;
  min-height: 100vh;
  background: var(--bg-main);
  isolation: isolate;
}
.shell::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  background:
    radial-gradient(900px 320px at 8% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
    radial-gradient(900px 320px at 92% 0%, color-mix(in srgb, var(--accent-soft) 40%, transparent), transparent 65%),
    linear-gradient(180deg, color-mix(in srgb, var(--bg-main) 94%, #000), var(--bg-main));
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 90%, transparent), color-mix(in srgb, var(--bg-card) 76%, transparent));
  border: 1px solid color-mix(in srgb, var(--border-color) 88%, transparent);
  border-radius: 18px;
  box-shadow: 0 8px 26px color-mix(in srgb, #000 24%, transparent);
  backdrop-filter: blur(14px) saturate(120%);
  padding: 0 0 2px 0;
}
.topbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 18px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark img {
  width: 52px;
  height: 52px;
  object-fit: contain;
}
.brand-title {
  font-size: 1.18em;
  font-weight: 900;
  color: var(--text-main);
}
.brand-sub {
  font-size: 0.98em;
  color: var(--text-soft);
}
.userchip {
  display: flex;
  align-items: center;
  gap: 8px;
  background: color-mix(in srgb, var(--bg-card) 92%, transparent);
  border-radius: 16px;
  padding: 4px 12px;
  font-size: 0.98em;
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--border-color) 86%, transparent);
}
.clockpill {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  font-size: 0.98em;
  color: var(--text-soft);
  margin-left: 12px;
}
.top-actions {
  margin-left: 12px;
}
.iconbtn.menu {
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  transition: background 0.15s;
}
.iconbtn.menu:hover {
  background: color-mix(in srgb, var(--accent-soft) 45%, transparent);
}
.hamb {
  display: inline-block;
  width: 24px;
  height: 18px;
  position: relative;
}
.hamb i {
  display: block;
  height: 3px;
  background: #444;
  margin: 4px 0;
  border-radius: 2px;
}
.menu-modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.18);
  align-items: center;
  justify-content: center;
}
.menu-modal[aria-hidden="false"], .menu-modal:has(.dialog) {
  display: flex;
}
.menu-modal .dialog {
  background: var(--bg-card);
  border: 1px solid color-mix(in srgb, var(--border-color) 88%, transparent);
  border-radius: 18px;
  box-shadow: 0 20px 54px color-mix(in srgb, #000 34%, transparent);
  backdrop-filter: blur(16px) saturate(125%);
  padding: 0;
  min-width: 320px;
  max-width: 96vw;
}
.menu-card {
  padding: 24px 18px 18px 18px;
}
.menu-card .head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.menu-card .title {
  font-size: 1.18em;
  font-weight: 900;
  color: var(--text-main);
}
.iconbtn.small.closex {
  background: none;
  border: none;
  font-size: 1.3em;
  cursor: pointer;
  color: var(--text-soft);
  border-radius: 8px;
  padding: 2px 8px;
}
.iconbtn.small.closex:hover {
  background: color-mix(in srgb, var(--accent-soft) 42%, transparent);
  color: var(--text-main);
}
.mini-label {
  font-size: 0.92em;
  color: var(--text-soft);
  margin-bottom: 4px;
}
.theme-select-wrapper {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}
.styled-select {
  padding: 6px 18px 6px 8px;
  border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--border-color) 88%, transparent);
  font-size: 1em;
  background: color-mix(in srgb, var(--inputBg) 90%, transparent);
  color: var(--text-main);
  appearance: none;
}
.select-arrow {
  font-size: 0.9em;
  color: var(--text-soft);
}

.btn.secondary.full {
  width: 100%;
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 84%, transparent), color-mix(in srgb, var(--accent-soft) 88%, transparent));
  color: var(--bg-main);
  border: none;
  border-radius: 10px;
  padding: 10px 0;
  font-weight: 700;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform 0.16s ease, filter 0.18s ease, box-shadow 0.2s ease;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent);
}
.btn.secondary.full:hover {
  transform: translateY(-1px);
  filter: saturate(1.08);
  box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 28%, transparent);
}

.menu-foot {
  margin-top: 18px;
  text-align: center;
  color: var(--text-soft);
  font-size: 0.95em;
}

.app2-container {
  padding: 24px;
  background: var(--bg-main);
  min-height: 100vh;
}
.app2-title {
  font-size: 1.5em;
  font-weight: bold;
  margin-bottom: 16px;
  color: var(--text-main);
}

.app2-section {
  margin-top: 24px;
}

.app2-table-section {
  margin: 10px 18px 18px;
}

.app2-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 18px;
}

.app2-summary-card {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid color-mix(in srgb, var(--border-color) 82%, transparent);
  background:
    radial-gradient(540px 180px at 85% 12%, color-mix(in srgb, var(--accent-soft) 34%, transparent), transparent 62%),
    radial-gradient(520px 180px at 8% 26%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 86%, transparent), color-mix(in srgb, var(--bg-main) 76%, transparent));
  box-shadow: 0 16px 38px color-mix(in srgb, #000 26%, transparent);
  padding: 18px 16px;
  transition: transform 0.18s ease, box-shadow 0.2s ease, border-color 0.18s ease;
  animation: app2FadeUp 320ms ease both;
}

.app2-summary-card::before {
  content: "";
  position: absolute;
  inset: -45% -60% auto auto;
  width: 180px;
  height: 180px;
  border-radius: 999px;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 68%);
  opacity: 0.72;
  pointer-events: none;
}

.app2-summary-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--accent) 48%, var(--border-color));
  box-shadow: 0 20px 42px color-mix(in srgb, #000 30%, transparent);
}

.app2-card-label {
  font-size: 0.95em;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: color-mix(in srgb, var(--text-main) 82%, transparent);
  margin-bottom: 10px;
}

.app2-card-value {
  font-size: 2em;
  line-height: 1;
  font-weight: 900;
  color: var(--primary, var(--accent));
  text-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent);
  margin-bottom: 10px;
}

.app2-card-note {
  font-size: 0.92em;
  color: color-mix(in srgb, var(--text-main) 72%, transparent);
}

.app2-btn-input {
  margin-top: 12px;
  margin-bottom: 0;
  height: 46px;
  font-weight: 900;
  letter-spacing: 0.05em;
  border-radius: 12px;
}

.trans-card {
  width: min(640px, 94vw);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  animation: app2FadeUp 220ms ease both;
}

.trans-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
}

.trans-field {
  min-width: 0;
}

.trans-field-full {
  grid-column: 1 / -1;
}

.trans-textarea {
  min-height: 88px;
  resize: vertical;
}

body.app2-page .topbar {
  padding: 12px 14px;
}
body.app2-page .topbar-row {
  display: grid;
  grid-template-columns: minmax(240px, 1.4fr) auto auto auto;
  align-items: center;
  gap: 12px;
}
body.app2-page .brand { min-width: 0; }
body.app2-page .userchip,
body.app2-page .clockpill,
body.app2-page .top-actions { margin: 0 !important; }
body.app2-page .top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-back-dashboard {
  background: linear-gradient(90deg, #ff4fd8 0%, #22d3ee 100%);
  color: #fff !important;
  font-weight: 900;
  font-size: 1em;
  letter-spacing: 0.08em;
  border: none;
  border-radius: 16px;
  box-shadow: 0 2px 16px 0 rgba(255,79,216,0.10), 0 1.5px 8px 0 rgba(34,211,238,0.10);
  padding: 12px 0;
  margin: 18px 0 0 0;
  transition: background 0.18s, color 0.18s, box-shadow 0.18s;
  cursor: pointer;
  text-shadow: 0 1px 8px rgba(0,0,0,0.10);
}
.btn-back-dashboard:hover {
  background: linear-gradient(90deg, #22d3ee 0%, #ff4fd8 100%);
  color: #fff;
  box-shadow: 0 4px 24px 0 rgba(255,79,216,0.18), 0 2px 12px 0 rgba(34,211,238,0.18);
}

.project-input {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--inputBorder, rgba(255,255,255,0.14));
  background: var(--inputBg, rgba(255,255,255,0.08));
  color: var(--inputText, var(--text));
  padding: 11px 12px;
  font-size: 14px;
  outline: none;
}
.project-input:focus {
  border-color: var(--primary, #ff4fd8);
  box-shadow: 0 0 0 2px rgba(255,79,216,0.18);
}
.project-status {
  margin-top: 8px;
  min-height: 18px;
  font-size: 12px;
  color: var(--text2, rgba(255,255,255,0.75));
}
.project-modal-actions {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 10px;
}
.btn-add-project {
  font-weight: 800;
}

.app2-menu-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.app2-menu-actions .btn.secondary.full {
  margin-bottom: 0;
  height: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.app2-menu-actions .btn-back-dashboard {
  margin: 0;
}
.project-note {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text2, rgba(255,255,255,0.75));
}
.project-switcher {
  min-width: 220px;
  max-width: 280px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--inputBorder, rgba(255,255,255,0.16));
  background: var(--inputBg, rgba(255,255,255,0.08));
  color: var(--inputText, var(--text));
  padding: 0 36px 0 12px;
  font-size: 13px;
  font-weight: 700;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
}
.project-switcher:focus {
  border-color: var(--primary, #ff4fd8);
  box-shadow: 0 0 0 2px rgba(255,79,216,0.18);
}
.project-switch-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.project-switch-wrap::after {
  content: '▼';
  position: absolute;
  right: 10px;
  font-size: 10px;
  color: rgba(255,255,255,0.75);
  pointer-events: none;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
body.app2-page .iconbtn.menu {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--border, rgba(255,255,255,0.16));
  background: var(--glass, rgba(255,255,255,0.06));
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
body.app2-page .iconbtn.menu:hover {
  background: color-mix(in srgb, var(--accent-soft) 40%, transparent);
}
body.app2-page .hamb {
  width: 18px;
  height: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
body.app2-page .hamb i {
  margin: 0;
  height: 2.5px;
  background: var(--text-main);
  border-radius: 2px;
  opacity: 0.95;
}

body.app2-page .present.app2-table-section {
  border: 1px solid color-mix(in srgb, var(--border-color) 88%, transparent);
  background:
    radial-gradient(700px 240px at 88% 5%, color-mix(in srgb, var(--accent-soft) 26%, transparent), transparent 65%),
    radial-gradient(700px 240px at 10% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
    linear-gradient(180deg, color-mix(in srgb, var(--bg-card) 88%, transparent), color-mix(in srgb, var(--bg-main) 78%, transparent));
  box-shadow: 0 18px 42px color-mix(in srgb, #000 28%, transparent);
}

body.app2-page .table-scroll::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 40%, transparent);
}

@keyframes app2FadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 560px) {
  body.app2-page .topbar-row::after {
    content: "" !important;
    display: block !important;
    position: absolute;
    left: 4px;
    right: 4px;
    top: 34px;
    height: 1px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.06) 100%) !important;
    opacity: 0.9;
    pointer-events: none;
  }

  body.app2-page .topbar {
    background:
      radial-gradient(900px 300px at 20% 0%, rgba(255,79,216,0.10), transparent 60%),
      radial-gradient(900px 300px at 90% 0%, rgba(34,211,238,0.10), transparent 60%),
      linear-gradient(180deg, rgba(18,22,44,0.62), rgba(12,14,30,0.50));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
  }

  .topbar-row { height: 48px; padding: 0 6px; }
  .brand-mark img { width: 36px; height: 36px; }
  .app2-container { padding: 12px; }
  .menu-modal .dialog { min-width: 90vw; }

  .app2-summary-grid {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 12px;
  }

  .app2-table-section {
    margin: 6px 12px 14px;
  }
  .app2-summary-card {
    padding: 14px;
    border-radius: 14px;
  }
  .app2-card-value {
    font-size: 1.8em;
  }

  body.app2-page .topbar {
    padding: 8px;
  }
  body.app2-page .topbar-row {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "brand clock"
      "user actions";
    gap: 6px 8px;
    align-items: center;
    padding: 0;
    min-height: 72px;
  }
  body.app2-page .brand { grid-area: brand; }
  body.app2-page .userchip { grid-area: user; justify-self: start; }
  body.app2-page .clockpill { grid-area: clock; justify-self: end; align-items: flex-end; }
  body.app2-page .top-actions {
    grid-area: actions;
    width: auto;
    justify-content: flex-end;
    gap: 8px;
  }
  .app2-menu-actions {
    grid-template-columns: 1fr;
  }

  .trans-form-grid {
    grid-template-columns: 1fr;
  }

  .trans-card {
    width: min(96vw, 560px);
    max-height: calc(100vh - 24px);
  }

  .project-switcher {
    min-width: 0;
    width: 160px;
    max-width: 100%;
    height: 38px;
    font-size: 12px;
  }
  body.app2-page .iconbtn.menu {
    width: 38px;
    height: 38px;
  }
}
</style>
